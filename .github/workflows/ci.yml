name: CI i publikacja

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Publiczne dane projektu Supabase – bezpieczne w przeglądarce, dostęp do danych chroni RLS.
  VITE_SUPABASE_URL: https://hwajuqkesgkemimiwrnj.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iMNk5kN6wDO5xsoQ6NmXCw_rwE4pFMT

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typy (TypeScript strict)
        run: npm run typecheck
      - name: Testy (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
